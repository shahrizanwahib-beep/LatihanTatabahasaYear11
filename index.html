<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 11 · Tatabahasa Bahasa Pertama</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ea;color:#16362d;font:17px/1.5 system-ui}header,main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(32px,6vw,65px);line-height:1;margin:.3em 0}nav{position:sticky;top:0;background:#153d31;color:white;padding:12px;z-index:2;text-align:center}nav a{color:white;margin:0 .35em;display:inline-block}section{scroll-margin-top:115px}fieldset,article{background:white;border:1px solid #ccd6cd;border-radius:12px;padding:16px;margin:12px 0;min-width:0}legend{font-weight:bold;background:white;padding:0 6px}label.option{display:block;padding:6px;cursor:pointer}textarea,input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid #799084;border-radius:6px}button{background:#164737;color:white;padding:10px 16px;border:0;border-radius:6px;font:inherit;cursor:pointer}#result{scroll-margin-top:110px}.feedback{color:#16593c;font-weight:bold}
fieldset{width:100%;min-inline-size:0}fieldset legend{display:table;float:left;width:100%;max-inline-size:100%;padding:0 0 8px;white-space:normal;overflow-wrap:anywhere}fieldset legend+label{clear:both}label.option,article label{overflow-wrap:anywhere}article label{display:block}textarea{max-width:100%;resize:vertical}</style><header><strong>YEAR 11 · BAHASA MELAYU</strong><h1>Tatabahasa Bahasa Pertama</h1><p>Jawab 40 soalan objektif dan taip jawapan bagi 10 soalan subjektif. Draf disimpan dalam pelayar ini.</p></header>
<nav id="nav"></nav><main><form id="quiz"><article><label>Nama murid <input type="text" name="nama" required></label><label>Kelas <input type="text" name="kelas" required></label></article><div id="questions"></div><button type="submit">Semak dan lengkapkan latihan</button></form><article id="result" hidden tabindex="-1"></article></main>
<script>
const groups=[["Kata Sendi dan Kata Hubung", [["Kami bertolak ___ Muar sebelum subuh.", "dari", "daripada", "kepada", "pada"], ["Cadangan itu diterima ___ wakil kelas semalam.", "daripada", "dari", "di", "ke"], ["Surat itu ditujukan ___ pengetua.", "kepada", "pada", "di", "daripada"], ["Mesyuarat bermula ___ pukul sembilan.", "pada", "kepada", "di", "dari"], ["Dia menutup pintu ___ bunyi bising dari luar tidak mengganggu mesyuarat.", "supaya", "kerana", "walaupun", "sambil"], ["___ hujan lebat, mereka tetap hadir.", "Walaupun", "Supaya", "Untuk", "Sambil"], ["Dia belum tahu ___ bas itu sudah bertolak atau belum.", "sama ada", "bahawa", "supaya", "kerana"], ["Mira membaca arahan ___ rakannya menyediakan peralatan.", "manakala", "supaya", "kerana", "walaupun"]]], ["Imbuhan dan Bentuk Kata", [["Pihak sekolah akan ___ dewan untuk majlis itu.", "memperbesar", "pembesaran", "membesari", "diperbesar"], ["Petugas ___ peserta dengan ramah di pintu masuk.", "menyambut", "mensambut", "penyambut", "sambutan"], ["Kakak sedang ___ bawang di dapur.", "mengupas", "mengkupas", "pengupas", "dikupas"], ["Dokumen itu perlu ___ sebelum mesyuarat.", "disemak", "di semak", "menyemak", "penyemak"], ["Program itu bertujuan untuk ___ hubungan antara murid.", "mempererat", "keakraban", "dipererat", "erat"], ["Pilih kata nama yang merujuk kepada orang yang menulis.", "penulis", "penulisan", "menulis", "tulisan"], ["Pilih kata nama yang merujuk kepada proses mengurus.", "pengurusan", "pengurus", "diurus", "mengurus"], ["Petugas sedang ___ label harga pada rak.", "menampal", "mentampal", "ditampal", "tampalan"]]], ["Frasa dan Ayat Gramatis", [["Pilih frasa yang betul.", "semua murid", "semua murid-murid", "para murid-murid", "setiap murid-murid"], ["Pilih frasa yang betul.", "antara sebab utama", "di antara sebab utama", "diantara sebab utama", "antara sebab-sebab utama"], ["Pilih frasa yang betul.", "paling cekap", "paling tercekap", "paling tercekap sekali", "paling cekap sekali"], ["Pilih ayat dengan kata pemeri yang sesuai sebelum frasa nama.", "Ibu saya ialah seorang guru.", "Ibu saya adalah seorang guru.", "Ibu saya ialah mengajar.", "Ibu saya adalah mengajar."], ["Pilih ayat dengan kata pemeri yang sesuai sebelum frasa adjektif.", "Maklumat itu adalah penting.", "Maklumat itu ialah penting.", "Maklumat itu ialah amat penting.", "Maklumat itu adalah disemak."], ["Pilih frasa bilangan yang betul.", "kedua-dua orang murid", "kedua-dua orang murid-murid", "kedua orang murid-murid", "kedua-dua murid-murid"], ["Pilih ayat yang betul.", "Mereka saling membantu.", "Mereka saling bantu-membantu.", "Mereka saling dibantu-bantu.", "Mereka saling pembantu."], ["Pilih frasa yang bermaksud beberapa helai baju.", "beberapa helai baju", "beberapa ekor baju", "beberapa batang baju", "beberapa orang baju"]]], ["Ayat Aktif dan Pasif", [["Tukarkan “Saya menulis laporan itu” kepada ayat pasif.", "Laporan itu saya tulis.", "Laporan itu ditulis saya.", "Laporan itu saya menulis.", "Laporan itu menulis saya."], ["Tukarkan “Kamu perlu membaca notis itu” kepada ayat pasif.", "Notis itu perlu kamu baca.", "Notis itu kamu perlu membaca.", "Notis itu perlu dibaca kamu.", "Notis itu membaca kamu."], ["“Farah menyusun kerusi itu.” Pilih ayat pasif yang tepat.", "Kerusi itu disusun oleh Farah.", "Farah disusun oleh kerusi itu.", "Kerusi itu menyusun Farah.", "Kerusi itu tersusun sendiri."], ["“Surat itu dibaca oleh Nabil.” Pilih ayat aktif yang tepat.", "Nabil membaca surat itu.", "Nabil dibaca oleh surat itu.", "Surat itu membaca Nabil.", "Nabil meminta surat itu dibaca."], ["Pilih ayat pasif yang menggunakan kata ganti diri pertama jamak.", "Borang itu telah kami isi.", "Borang itu telah mengisi kami.", "Kami telah mengisi borang itu.", "Kami telah diisi oleh borang itu."], ["“Ibu menggoreng ikan.” Apakah objek ayat ini?", "ikan", "ibu", "menggoreng", "ibu menggoreng"], ["Pilih ayat yang mempunyai kata kerja transitif.", "Faris membaiki basikal.", "Faris sedang tidur.", "Faris tersenyum.", "Faris berdiri."], ["Pilih ayat pasif yang mengekalkan maksud “Mereka akan menghantar bungkusan esok”.", "Bungkusan akan dihantar oleh mereka esok.", "Bungkusan telah dihantar oleh mereka semalam.", "Mereka akan menerima bungkusan esok.", "Bungkusan itu akan membuka mereka esok."]]], ["Ejaan dan Kata Majmuk", [["Pilih ejaan yang betul.", "tanggungjawab", "tanggung jawab", "tanggongjawab", "tanggung-jawab"], ["Pilih ejaan yang betul.", "kerjasama", "kerja sama", "kerja-sama", "kerjasamma"], ["Pilih ejaan yang betul.", "alat tulis", "alattulis", "alat-tulis", "allat tulis"], ["Pilih ejaan yang betul.", "tengah hari", "tengahhari", "tengah-hari", "tenggah hari"], ["Pilih ejaan yang betul.", "diambil", "di ambil", "di-ambil", "di Ambil"], ["Pilih ejaan yang betul.", "di pejabat", "dipejabat", "di-pejabat", "diPejabat"], ["Pilih ejaan yang betul.", "ibu bapa", "ibubapa", "ibu-bapa", "ibubappa"], ["Pilih ejaan yang betul.", "setiausaha", "setia usaha", "setia-usaha", "setiaushaa"]]]];
const writing=[["Betulkan dua kesalahan. “Hadiah itu diterima dari guru lalu dibawa kerumah.”"], ["Tulis satu ayat menggunakan “daripada” untuk menyatakan sumber sesuatu maklumat."], ["Betulkan imbuhan dalam ayat ini. “Mereka mensusun kerusi sebelum majlis.”"], ["Isi tempat kosong menggunakan kata berimbuhan daripada kata dasar “urus”. “Pihak sekolah perlu _____ pendaftaran peserta.”"], ["Baiki dua kesalahan. “Para murid-murid itu saling tolong-menolong.”"], ["Gabungkan dengan “walaupun”. “Aina berasa letih. Aina menyiapkan tugasan itu.”"], ["Tukarkan kepada ayat pasif. “Saya telah menyiapkan laporan itu.”"], ["Tukarkan kepada ayat aktif. “Borang itu diperiksa oleh penyelia.”"], ["Betulkan dua kesalahan ejaan. “Pada waktu tengahhari, surat itu di serahkan kepada guru.”"], ["Bina satu ayat menggunakan “supaya” untuk menyatakan tujuan mengulang kaji pelajaran."]];
const form=document.querySelector('#quiz'), questions=document.querySelector('#questions'), result=document.querySelector('#result');
const objective=groups.flatMap(([,items])=>items);
let number=0;
function choices(item,index){
 const [question,...answers]=item;
 const turn=(index*7+Math.floor(index/4))%4;
 const rotated=answers.slice(turn).concat(answers.slice(0,turn));
 return '<fieldset><legend>'+(index+1)+'. '+question+'</legend>'+rotated.map(answer=>'<label class="option"><input required type="radio" name="q'+index+'" value="'+answers.indexOf(answer)+'"> '+answer+'</label>').join('')+'</fieldset>';
}
questions.innerHTML=groups.map(([name,items],index)=>'<section id="g'+index+'"><h2>'+name+'</h2>'+items.map(item=>choices(item,number++)).join('')+'</section>').join('')+'<section id="subjective"><h2>Subjektif</h2>'+writing.map(([question],index)=>'<article><label for="s'+index+'">'+(41+index)+'. '+question+'</label><textarea required rows="3" id="s'+index+'" name="s'+index+'"></textarea></article>').join('')+'</section>';
document.querySelector('#nav').innerHTML=groups.map((_,i)=>'<a href="#g'+i+'">'+groups[i][0]+'</a>').join('')+' <a href="#subjective">Subjektif</a> <span id="progress"></span>';
const storageKey='year11-tatabahasa-units1to5-v1';
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
 for(const [name,value] of Object.entries(saved)){
  const field=form.elements.namedItem(name);
  if(field)field.value=value;
 }
}catch{}
function update(){
 const values=Object.fromEntries(new FormData(form));
 const answered=Object.entries(values).filter(([name,value])=>/^[qs]\d+$/.test(name)&&value.trim()).length;
 document.querySelector('#progress').textContent=answered+' / 50';
 try{localStorage.setItem(storageKey,JSON.stringify(values))}catch{}
}
form.addEventListener('input',()=>{result.hidden=true;update()});
form.addEventListener('submit',async event=>{
 event.preventDefault();
 for(const field of form.querySelectorAll('textarea,input[type=text]')){
  if(!field.value.trim()){field.focus();return}
 }
 const values=new FormData(form);
 const score=objective.reduce((sum,_,i)=>sum+Number(values.get('q'+i)==='0'),0);
 result.innerHTML='<p class="feedback">50 daripada 50 soalan dijawab</p><p id="identity"></p>'+'<h2>Objektif '+score+' / 40</h2><p>Jawapan subjektif tersedia untuk semakan guru. Ambil tangkapan skrin keputusan ini.</p><button id="download">Muat turun jawapan</button><details><summary>Semak jawapan objektif</summary><ol>'+objective.map((item,i)=>'<li>'+item[1]+(values.get('q'+i)==='0'?' ✓':'')+'</li>').join('')+'</ol></details>';
 document.querySelector('#identity').textContent=values.get('nama')+' · '+values.get('kelas');
 document.querySelector('#download').onclick=()=>{
  const report=['Nama: '+values.get('nama'),'Kelas: '+values.get('kelas'),'Objektif: '+score+'/40','',...objective.map((item,i)=>(i+1)+'. '+item[1+Number(values.get('q'+i))]),'',...writing.map(([q],i)=>(41+i)+'. '+q+'\n'+values.get('s'+i))].join('\n');
  const url=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='jawapan-year11-tatabahasa.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 result.hidden=false;result.focus();result.scrollIntoView();
});
update();
</script></html>
